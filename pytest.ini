# Repo-root pytest configuration.
#
# Scoped strictly to ./tests/ so a sibling clone of hermes-webui or any
# other foreign tree under the project root never gets walked. This is
# the global default; scripts/test.ps1 reinforces it with an explicit
# testpath + --ignore flags so even running `pytest` directly (without
# this file) on a fresh checkout still does the right thing.
[pytest]
testpaths = tests
norecursedirs =
    hermes-webui
    external
    vendor
    third_party
    node_modules
    .venv
    .git
    .pytest_cache
    build
    dist
    *.egg-info
    __pycache__
    logs
    models
